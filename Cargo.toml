[package]
name = "stapps-debugger"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
mail-auth = { version = "0.13.3", default-features = false, features = ["dns-hickory", "rust-crypto"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
